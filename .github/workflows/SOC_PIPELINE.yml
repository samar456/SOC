name: SOC Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake wget

    # 1. CACHE SYSTEMC: This saves ~3-5 minutes per run
    - name: Cache SystemC
      id: cache-systemc
      uses: actions/cache@v4
      with:
        path: /opt/systemc
        key: ${{ runner.os }}-systemc-2.3.4

    # 2. INSTALL SYSTEMC (Only runs if cache is missing)
    - name: Install SystemC
      if: steps.cache-systemc.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/accellera-official/systemc/archive/refs/tags/2.3.4.tar.gz
        tar -xzf 2.3.4.tar.gz
        cd systemc-2.3.4
        mkdir build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=/opt/systemc -DCMAKE_CXX_STANDARD=17
        make -j$(nproc)
        sudo make install

    # 3. BUILD YOUR PROJECT
    - name: Build Project
      run: |
        g++ main.cpp \
        -std=c++17 \
        -I/opt/systemc/include \
        -L/opt/systemc/lib \
        -Wl,-rpath=/opt/systemc/lib \
        -lsystemc \
        -lm \
        -o soc

    # 4. RUN SIMULATION
    - name: Run Executable
      run: ./soc
