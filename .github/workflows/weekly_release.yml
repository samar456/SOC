name: Weekly Release
on:
  schedule:
    - cron: '0 20 * * 5'
  workflow_dispatch: 

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Force Merge Develop into Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch all branches
          git fetch origin main:main
          git fetch origin develop:develop
          
          git checkout main
          # Merge develop into main, favoring develop's changes if there's a conflict
          git merge develop --no-ff --strategy-option theirs -m "chore: weekly release $(date +'%Y-%m-%d')"
          
          # Push directly to the protected branch
          git push origin main          token: ${{ secrets.BOT_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge
