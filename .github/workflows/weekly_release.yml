name: Weekly Release

on:
  schedule:
    - cron: '0 20 * * 5' # Every Friday at 8PM UTC
  workflow_dispatch: 

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0 # Fetches all history for all branches

      - name: Sync and Merge
        run: |
          # 1. Identity setup
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Ensure local main and develop are up to date
          git fetch origin main:main
          git fetch origin develop:develop

          # 3. Switch to main
          git checkout main

          # 4. Merge develop into main
          # Using --strategy-option theirs resolves minor conflicts by favoring develop
          git merge develop --no-ff --strategy-option theirs -m "chore: weekly release $(date +'%Y-%m-%d')"

          # 5. Push to Protected Branch
          # This works because you are using BOT_TOKEN (Admin PAT) 
          # and "Enforce for Administrators" is UNCHECKED on GitHub
          git push origin main
