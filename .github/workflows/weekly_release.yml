name: Weekly Release

on:
  schedule:
    - cron: '0 20 * * 5' # Every Friday at 8PM UTC
  workflow_dispatch: # Allows you to run it manually for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BOT_TOKEN }}
          branch: automated-release-branch
          base: main
          title: "Weekly Release: Merge Develop into Main ($(date +'%Y-%m-%d'))"
          body: "Automated merge of develop into main for the weekly release."
          delete-branch: true

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-number
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.BOT_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge
