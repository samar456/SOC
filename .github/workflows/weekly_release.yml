name: Weekly Release

on:
  schedule:
    - cron: '0 20 * * 5' # Every Friday at 8PM UTC
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0 # Fetches all history so it can see both branches

      - name: Admin Merge and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Bring in the latest info from the server without overwriting local refs
          git fetch origin main
          git fetch origin develop

          # 2. Force switch to a clean 'main' branch
          # This avoids the "refusing to fetch" error because we use -B (force create/reset)
          git checkout -B main origin/main

          # 3. Merge the remote 'develop' branch into our clean 'main'
          git merge origin/develop --no-ff --strategy-option theirs -m "chore: weekly release $(date +'%Y-%m-%d')"

          # 4. Push to the protected branch
          git push origin main
